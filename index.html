<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Lockall — Localisation d'un box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --lockall-blue: #181AC4;
    --lockall-blue-dark: #12139a;
    --lockall-orange: #FEA800;
    --lockall-black: #000000;
    --lockall-text: #202020;
    --lockall-bg: #f4f4f4;
    --lockall-lavender: #dcdcff;
    --lockall-white: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background: var(--lockall-bg);
    margin: 0;
    padding: 0;
    color: var(--lockall-text);
  }

  header.brand-header {
    background: var(--lockall-black);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.brand-header img {
    height: 28px;
    max-width: 60vw;
    display: block;
  }

  main {
    padding: 20px 12px 40px 12px;
  }

  h1 {
    text-align: center;
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 20px 0;
    color: var(--lockall-black);
    padding: 0 8px;
  }
  h1 span {
    color: var(--lockall-blue);
  }

  .card {
    max-width: 480px;
    margin: 0 auto 24px auto;
    background: var(--lockall-white);
    border-radius: 14px;
    padding: 18px 16px;
    box-shadow: 0 4px 16px rgba(29, 29, 205, 0.08);
    border: 1px solid #ececec;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 18px;
    font-size: 0.9rem;
    color: var(--lockall-black);
  }
  label:first-of-type { margin-top: 0; }
  select, input[type="text"] {
    width: 100%;
    padding: 13px 12px;
    font-size: 16px;
    font-family: inherit;
    border: 2px solid #e2e2f5;
    border-radius: 8px;
    background: var(--lockall-white);
    color: var(--lockall-text);
    transition: border-color 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23181AC4'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 20px;
    padding-right: 38px;
  }
  select:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--lockall-blue);
  }
  input[type="text"] {
    letter-spacing: 3px;
    font-family: 'Poppins', monospace;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--lockall-blue-dark);
  }
  .hint {
    font-size: 0.78rem;
    color: #888;
    margin-top: 5px;
  }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 13px;
    background: var(--lockall-orange);
    color: var(--lockall-black);
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  button:hover { filter: brightness(0.95); }
  button:active { transform: scale(0.98); }

  #result-wrap {
    max-width: 480px;
    margin: 0 auto;
  }

  .result-box {
    background: var(--lockall-white);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(29, 29, 205, 0.08);
    border-left: 6px solid var(--lockall-blue);
  }
  .result-box.error { border-left-color: #c0392b; }
  .result-box.warning { border-left-color: var(--lockall-orange); }
  .result-box h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0 0 8px 0;
    color: #888;
    font-weight: 600;
  }
  .result-box .location {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--lockall-blue);
    word-break: break-word;
  }
  .result-box.error .location { color: #c0392b; }
  .result-box.warning .location { color: #b06e00; }
  .result-box .sub {
    font-size: 0.85rem;
    color: #777;
    margin-top: 6px;
  }

  .table-wrap {
    background: var(--lockall-white);
    box-shadow: 0 4px 16px rgba(29, 29, 205, 0.08);
    border-radius: 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    min-width: 380px;
    border-collapse: collapse;
    background: var(--lockall-white);
  }
  caption {
    background: var(--lockall-blue);
    color: var(--lockall-white);
    font-weight: 700;
    padding: 10px;
    text-align: center;
    letter-spacing: 1px;
    font-size: 0.95rem;
    position: sticky;
    left: 0;
  }
  th, td {
    border: 1px solid #ececec;
    padding: 9px 12px;
    font-size: 0.85rem;
    text-align: left;
    white-space: nowrap;
  }
  thead th {
    background: var(--lockall-black);
    color: var(--lockall-white);
    font-weight: 600;
  }
  tr.match {
    background: var(--lockall-lavender);
    font-weight: 700;
    color: var(--lockall-blue-dark);
  }
  tr.match td:first-child {
    position: relative;
  }
  tr.match td:first-child::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lockall-orange);
    margin-right: 8px;
  }

  footer {
    text-align: center;
    font-size: 0.78rem;
    color: #999;
    padding: 20px 0 10px 0;
  }

  @media (max-width: 380px) {
    h1 { font-size: 1.1rem; }
    .card { padding: 16px 12px; }
    .result-box { padding: 16px 14px; }
    .result-box .location { font-size: 1.25rem; }
  }
</style>
</head>

const boxInput = document.getElementById("box");
boxInput.addEventListener("input", () => {
  boxInput.value = boxInput.value.replace(/\D/g, "").slice(0, 4);
});
boxInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("search-btn").click();
});

document.getElementById("search-btn").addEventListener("click", () => {
  const site = siteSelect.value;
  const rawBox = boxInput.value.trim();
  const wrap = document.getElementById("result-wrap");
  wrap.innerHTML = "";

  if (!site) {
    wrap.innerHTML = resultBox("error", "Erreur", "Veuillez choisir un site.");
    return;
  }
  if (!/^\d{4}$/.test(rawBox)) {
    wrap.innerHTML = resultBox("error", "Erreur", "Le numéro de box doit comporter exactement 4 chiffres.");
    return;
  }

  const ranges = SITES[site];

  if (ranges.length === 0) {
    wrap.innerHTML = resultBox("warning", "Information indisponible", "Aucune donnée pour le moment", `Site : ${site} — le référentiel des box sera ajouté prochainement.`);
    return;
  }

  const num = parseInt(rawBox, 10);
  const matches = ranges.filter(r => num >= r.min && num <= r.max);

  let html = "";
  if (matches.length === 0) {
    html += resultBox("error", "Aucune correspondance", `Le box ${rawBox} n'appartient à aucune plage connue pour le site ${site}.`);
  } else if (matches.length === 1) {
    html += resultBox("ok", "Résultat", matches[0].label, `Box ${rawBox} — ${site}`);
  } else {
    // plages qui se chevauchent dans les données source
    const labels = matches.map(m => m.label).join(" / ");
    html += resultBox("warning", "Plusieurs zones possibles", labels, `Box ${rawBox} — ${site} (plages se chevauchant dans le référentiel)`);
  }

  html += buildTable(site, ranges, matches);
  wrap.innerHTML = html;
});

function resultBox(type, title, mainText, subText) {
  const cls = type === "ok" ? "" : (type === "warning" ? " warning" : " error");
  return `
    <div class="result-box${cls}">
      <h2>${title}</h2>
      <div class="location">${mainText}</div>
      ${subText ? `<div class="sub">${subText}</div>` : ""}
    </div>`;
}

function buildTable(site, ranges, matches) {
  const matchSet = new Set(matches);
  let rows = ranges.map(r => {
    const isMatch = matchSet.has(r);
    return `<tr class="${isMatch ? "match" : ""}">
      <td>${pad4(r.min)} - ${pad4(r.max)}</td>
      <td>${r.label}</td>
    </tr>`;
  }).join("");

  return `
    <div class="table-wrap">
      <table>
        <caption>${site}</caption>
        <thead><tr><th>Plage</th><th>Zone</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
</script>

</body>
</html>
